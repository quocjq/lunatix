<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lunatix · dashboard</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e9ef; --mut:#8b93a3; --acc:#7aa2f7; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; min-height:100vh; }
    header { padding:28px 24px 8px; }
    h1 { font-size:22px; } h1 span { color:var(--acc); }
    p.sub { color:var(--mut); margin-top:4px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; padding:20px 24px; }
    a.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; text-decoration:none; color:var(--fg); transition:border-color .15s, transform .15s; }
    a.card:hover { border-color:var(--acc); transform:translateY(-2px); }
    a.card h3 { font-size:16px; color:var(--acc); }
    a.card p { color:var(--mut); font-size:13px; margin-top:6px; }
    .notes { padding:0 24px 28px; }
    textarea { width:100%; min-height:180px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:14px; font:14px/1.6 ui-monospace,monospace; resize:vertical; }
    .row { display:flex; gap:8px; margin:10px 0; align-items:center; }
    button { background:var(--acc); color:#0b0e14; border:0; border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
    button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); }
    #status { color:var(--mut); font-size:13px; }
    .ok { color:#7ee787; } .bad { color:#ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>lunatix <span>dashboard</span></h1>
    <p class="sub" id="status">server: <span class="bad">checking…</span></p>
  </header>

  <div class="grid">
    <a class="card" href="/forgejo/"><h3>Forgejo</h3><p>Self-hosted git — alternative to GitHub.</p></a>
    <a class="card" href="https://dns.lunixose.duckdns.org/"><h3>Pi-hole</h3><p>Network-wide ad blocking &amp; DNS.</p></a>
    <a class="card" href="https://dns.lunixose.duckdns.org/admin/"><h3>Pi-hole admin</h3><p>Filters, blocklists, query log.</p></a>
  </div>

  <section class="notes">
    <h3>Notes</h3>
    <div class="row">
      <button id="save">Save</button>
      <button class="ghost" id="clear">Clear</button>
      <span id="saved"></span>
    </div>
    <textarea id="notes" placeholder="Notes, tasks, links… saved locally in your browser."></textarea>
  </section>

  <script>
    const status = document.querySelector('#status span');
    fetch('/forgejo/api/v1/version').then(r => {
      status.textContent = r.ok ? 'online' : 'offline';
      status.className = r.ok ? 'ok' : 'bad';
    }).catch(() => { status.textContent = 'offline'; status.className='bad'; });

    const ta = document.getElementById('notes');
    ta.value = localStorage.getItem('notes') || '';
    document.getElementById('save').onclick = () => {
      localStorage.setItem('notes', ta.value);
      document.getElementById('saved').textContent = 'saved ✓';
      setTimeout(() => document.getElementById('saved').textContent='', 1500);
    };
    document.getElementById('clear').onclick = () => { ta.value=''; localStorage.removeItem('notes'); };
  </script>
</body>
</html>
